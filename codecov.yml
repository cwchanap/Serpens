coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false

ignore:
  - 'src/lib/vitest-examples'
  - 'src/routes/demo'
  # Balance harness lives in tests/balance/**: it is test-side code (bots/CLI/
  # measurement), exercised by its own specs but outside the src/** coverage
  # instrumentation — same category as the spec ignores below, so Codecov must
  # not score it as uninstrumented patch lines (if_not_found: failure).
  - 'tests/**'
  - 'src/**/*.spec.ts'
  - 'src/**/*.svelte.spec.ts'
  - 'src/**/*.e2e.ts'
  - 'src/app.d.ts'
  # +page.svelte is the 1300+ line Svelte 5 runes UI shell, covered end-to-end by
  # retail-sim.e2e.ts (canvas data-* attributes, tile clicks, panel toggles) rather
  # than unit specs. Excluded so the unit coverage metric reflects src/lib/game
  # pure-logic coverage; the e2e suite is the coverage gate for the UI layer.
  - 'src/routes/+page.svelte'
  - 'src/routes/+layout.svelte'
  - 'src/routes/+layout.ts'
