name: Apply E2E alert locator fix

on:
  push:
    branches:
      - codex/hpa-277-finance-debt-runway
    paths:
      - .github/workflows/apply-e2e-alert-locator-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: codex/hpa-277-finance-debt-runway
          fetch-depth: 0

      - name: Apply locator fix and remove helper workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/retail-sim.e2e.ts')
          content = path.read_text()
          old = "await page.getByRole('button', { name: /^alerts/i }).click();"
          new = "await page.getByRole('button', { name: /^\\d+ alerts?$/i }).click();"
          if content.count(old) != 2:
              raise SystemExit(f'Expected two legacy alert locators, found {content.count(old)}')
          marker = "if (!alertWindowLoan) throw new Error('Working-capital loan disappeared before its alert.');"
          marker_index = content.index(marker)
          locator_index = content.index(old, marker_index)
          content = content[:locator_index] + new + content[locator_index + len(old):]
          path.write_text(content)
          PY
          git rm .github/workflows/apply-e2e-alert-locator-fix.yml

      - name: Commit E2E fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/retail-sim.e2e.ts
          git diff --cached --check
          git commit -m "fix(e2e): match counted alerts button label"
          git push origin HEAD:codex/hpa-277-finance-debt-runway
