name: Apply automatic time implementation

on:
  push:
    branches: [feat/automatic-time-wasd-camera]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/automatic-time-wasd-camera
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply implementation
        run: python scripts/apply_time_flow.py
      - name: Format touched files
        run: |
          bunx prettier --write \
            src/lib/game/keyboardShortcuts.ts \
            src/lib/components/game/ControlDesk.svelte \
            src/lib/components/game/ControlDesk.svelte.spec.ts \
            src/lib/components/game/ControlDesk.timeControls.svelte.spec.ts \
            src/lib/components/game/ShortcutCheatSheet.svelte \
            src/lib/components/game/CityMap.svelte \
            src/routes/MapSurfaceHost.svelte \
            src/lib/phaser/cityMapScene.ts \
            src/lib/phaser/industryMapScene.ts \
            src/routes/+page.svelte \
            src/routes/gameRouteController.ts \
            src/lib/i18n/messages/en.ts \
            src/lib/i18n/messages/ja.ts \
            src/lib/i18n/messages/zh-Hant.ts \
            src/routes/time-flow.e2e.ts \
            src/routes/retail-sim.e2e.ts
      - name: Verify focused behavior
        run: |
          bun run test:unit -- src/lib/game/keyboardShortcuts.spec.ts src/lib/phaser/cameraKeyboardPan.spec.ts --run
          bun run check
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_time_flow.py
          rm .github/workflows/red-time-targets.yml
          rm .github/workflows/apply-time-flow-implementation.yml
      - name: Commit implementation
        env:
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add automatic time flow and WASD camera pan"
          git push origin HEAD:feat/automatic-time-wasd-camera
