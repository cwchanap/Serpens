name: Apply runtime spec type fix

on:
  push:
    branches:
      - codex/hpa-277-finance-debt-runway
    paths:
      - .github/workflows/apply-runtime-spec-type-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: codex/hpa-277-finance-debt-runway
          fetch-depth: 0

      - name: Apply type-safe test fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/scenarios/runtime.spec.ts')
          content = path.read_text()

          old_cases = "const cases: Array<{ command: ScenarioCommand; allowed: string[] }> = ["
          new_cases = "const cases: Array<{ command: ScenarioCommand; allowed: ScenarioCommand['kind'][] }> = ["
          if old_cases not in content:
              raise SystemExit('Expected cases declaration was not found')
          content = content.replace(old_cases, new_cases, 1)

          old_call = 'const definition = commandDefinition(allowed as readonly string[]);'
          new_call = 'const definition = commandDefinition(allowed);'
          if old_call not in content:
              raise SystemExit('Expected commandDefinition call was not found')
          content = content.replace(old_call, new_call, 1)

          path.write_text(content)
          PY

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/scenarios/runtime.spec.ts
          git diff --cached --check
          git commit -m "fix(ci): preserve scenario command kind types"
          git push origin HEAD:codex/hpa-277-finance-debt-runway
