name: Format RED time-flow tests

on:
  push:
    branches: [feat/automatic-time-wasd-camera]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/automatic-time-wasd-camera
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Normalize RED specs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/phaser/cameraKeyboardPan.spec.ts')
          text = path.read_text()
          text = text.replace('constructor(_config: unknown) {}', 'constructor() {}')
          path.write_text(text)
          PY
          bunx prettier --write src/lib/components/game/ControlDesk.timeControls.svelte.spec.ts src/lib/phaser/cameraKeyboardPan.spec.ts src/routes/time-flow.e2e.ts
          bunx eslint src/lib/components/game/ControlDesk.timeControls.svelte.spec.ts src/lib/phaser/cameraKeyboardPan.spec.ts src/routes/time-flow.e2e.ts
      - run: rm .github/workflows/format-red-time-tests.yml
      - name: Commit formatted tests
        env:
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/game/ControlDesk.timeControls.svelte.spec.ts src/lib/phaser/cameraKeyboardPan.spec.ts src/routes/time-flow.e2e.ts .github/workflows/format-red-time-tests.yml
          git commit -m "style: format time-flow RED tests"
          git push origin HEAD:feat/automatic-time-wasd-camera
