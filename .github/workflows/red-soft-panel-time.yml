name: RED soft-panel time toggle

on:
  push:
    branches: [feat/automatic-time-wasd-camera]

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/automatic-time-wasd-camera
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit -- src/lib/game/keyboardShortcuts.spec.ts --run
