<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			First paint: the stylesheet ships with the JS bundle (ssr = false), so
			paint the walnut stage and a boot mark inline until the app mounts.
			+layout.svelte removes #app-boot on mount.
		-->
		<style>
			html,
			body {
				margin: 0;
				background: #14100a;
			}

			#app-boot {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				align-content: center;
				gap: 0.9rem;
				color: #d4a852;
				font:
					600 0.8rem/1.4 system-ui,
					sans-serif;
				letter-spacing: 0.24em;
				text-transform: uppercase;
			}

			#app-boot .app-boot-mark {
				width: 2.25rem;
				height: 2.25rem;
				border: 2px solid #8e6420;
				border-top-color: #efd79a;
				border-radius: 50%;
				animation: app-boot-spin 1s linear infinite;
			}

			@keyframes app-boot-spin {
				to {
					transform: rotate(360deg);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				#app-boot .app-boot-mark {
					animation: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-boot" role="status" aria-live="polite">
			<div class="app-boot-mark" aria-hidden="true"></div>
			<span>Serpens</span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
